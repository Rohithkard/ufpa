name: upfa
description: UPFA
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.6.6
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.7.0
  intl: ^0.19.0
  flutter_svg:
  http:
  otp_autofill: ^4.0.0
  cached_network_image: ^3.4.0
  qr_flutter: ^4.1.0
  qr_code_scanner:
  sms_autofill: 2.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  flutter_launcher_icons: "^0.14.1"
  change_app_package_name:
flutter_launcher_icons:
      android: "launcher_icon"
      ios: true
      image_path: "assets/icons/app_logo.png"
      min_sdk_android: 21
      web:

flutter:
  uses-material-design: true

  assets:
   - assets/icons/
   - assets/images/




